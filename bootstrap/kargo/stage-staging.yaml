apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: staging
  namespace: demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  shard: demo-agent
  requestedFreight:
    - origin:
        kind: Warehouse
        name: nginx
      sources:
        stages:
          - dev
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: https://github.com/jiachengxu/akuity-mcp-demo.git
            checkout:
              - branch: main
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/envs/staging/deployment.yaml
            updates:
              - key: spec.template.spec.containers.0.image
                value: '${{ imageFrom("nginx").RepoURL }}:${{ imageFrom("nginx").Tag }}'
        - uses: git-commit
          config:
            path: ./repo
            message: 'Promote nginx ${{ imageFrom("nginx").Tag }} to staging'
        - uses: git-push
          as: push
          config:
            path: ./repo
        - uses: argocd-update
          config:
            apps:
              - name: demo-staging
                sources:
                  - repoURL: https://github.com/jiachengxu/akuity-mcp-demo.git
                    desiredRevision: '${{ outputs.push.commit }}'
