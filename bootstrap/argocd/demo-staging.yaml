apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-staging
  annotations:
    kargo.akuity.io/authorized-stage: "demo:staging"
spec:
  project: default
  source:
    repoURL: https://github.com/jiachengxu/akuity-mcp-demo.git
    targetRevision: main
    path: envs/staging
  destination:
    name: demo-mcp
    namespace: demo-staging
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
