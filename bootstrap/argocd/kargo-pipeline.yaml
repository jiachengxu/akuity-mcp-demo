apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-pipeline
spec:
  project: default
  source:
    repoURL: https://github.com/jiachengxu/akuity-mcp-demo.git
    targetRevision: main
    path: bootstrap/kargo
  destination:
    name: kargo-ctl
    namespace: demo
  syncPolicy:
    automated:
      prune: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
